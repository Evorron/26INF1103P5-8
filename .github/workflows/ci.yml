name: CI Pipeline

# Workflow Event triggers
on:
  push:
    branches:
    - main 
  pull_request:
    branches:
    - main

# Workflow
jobs:
  # Workflow job "build_and_test"
  build_and_test:
    # Runner - Server where job runs on
    runs-on: ubuntu-latest
    
    # Sequence of task executed as part of the job
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    # Setup the Python environment  
    - name: Setup Python (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"    # Caching "pip" dependencies for CI efficiency

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt ruff pytest

    - name: Lint with "Ruff"
      run: ruff check .

    - name: Run Unit Tests with "pytest"
      run: pytest

    # Verifies docker image compliation
    - name: Attempt Docker Build
      run: docker build -t hawkerai-test .

# Questions to ask:
# 1. Create multiple YAML files for each automated workflows or all under one as CI?
# 2. Have a set requirements configuration/text file for workflow installation? (Instead of installation each manually as above)